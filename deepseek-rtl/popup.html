<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 260px;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        *{
        font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 20px;
        }
        .site {
            color: #666;
            font-size: 11px;
            margin-bottom: 20px;
        }
        .status-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .status-label {
            color: #666;
            font-size: 12px;
        }
        #status {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .enable {
            /* font-family: 'Segoe UI', Tahoma, sans-serif; */
            background: #4CAF50;
            color: white;
        }
        .disable {
            /* font-family: 'Segoe UI', Tahoma, sans-serif; */
            background: #f44336;
            color: white;
        }
        .note {
            /* font-family: 'Segoe UI', Tahoma, sans-serif;  */
            background: #e3f2fd;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #0d47a1;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔄 DeepSeek RTL</h2>
        <div class="site">🔒 فقط برای deepseek.com</div>
        
        <div class="status-box">
            <div class="status-label">وضعیت:</div>
            <div id="status">⭕ غیرفعال</div>
        </div>
        
        <button class="enable" id="enableBtn">✅ فعال‌سازی دائمی</button>
        <button class="disable" id="disableBtn">❌ غیرفعال‌سازی</button>
        
        <div class="note">
            <strong>✨ یکبار فعال کن، همیشه می‌مونه</strong><br>
            • بعد از رفرش صفحه<br>
            • بعد از بستن و باز کردن مرورگر<br>
            • هر بار که وارد DeepSeek میشی
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
